<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chicken.io</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="leaderboard">
      <h3>🐔 Top Chickens</h3>
      <ol id="leaderboard-list"></ol>
    </div>
    <div id="score">Length: 0</div>
  </div>

  <div id="menu">
    <div id="menu-box">
      <h1>🐔 Chicken.io</h1>
      <p>Peck pellets, grow your flock line, don't run into other chickens!</p>
      <input id="name-input" maxlength="16" placeholder="Chicken name" />
      <button id="play-btn">Play</button>
      <p class="hint">Mouse to steer &middot; Click / Space to boost</p>
    </div>
  </div>

  <div id="death-screen" class="hidden">
    <div id="death-box">
      <h1>You got plucked! 🪶</h1>
      <p id="final-score"></p>
      <button id="respawn-btn">Play Again</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
